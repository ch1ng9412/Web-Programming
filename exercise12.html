<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise12</title>
    <style>
        body {
            /* Using a serif font to match the text in the screenshot */
            font-family: "Times New Roman", Times, serif;
            font-size: 16px;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 2px;
        }

        input[type="text"] {
            /* Basic styling to match standard browser input fields */
            padding: 3px;
            width: 200px;
            border: 1px solid #ccc;
            font-family: Arial, sans-serif; /* Inputs usually default to sans-serif */
        }

        .button-group {
            margin-top: 20px;
        }

        input[type="submit"], 
        input[type="reset"] {
            padding: 4px 8px;
            margin-right: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <form action="#" method="get">
        <div class="form-group">
            <label for="firstName">First name:</label>
            <!-- Using the 'value' attribute sets the default text -->
            <input type="text" id="firstName" name="firstName" value="Your first name">
        </div>

        <div class="form-group">
            <label for="lastName">Last name:</label>
            <input type="text" id="lastName" name="lastName" value="Your last name">
        </div>

        <div class="form-group">
            <label for="studentId">Student ID:</label>
            <input type="text" id="studentId" name="studentId" value="Your student ID">
        </div>

        <div class="button-group">
            <!-- type="submit" will submit the form -->
            <input type="submit" value="Submit">
            <!-- type="reset" will automatically restore inputs to their default 'value' -->
            <input type="reset" value="重設">
        </div>
    </form>

</body>
</html>
